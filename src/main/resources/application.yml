server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: student-milk-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_milk_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      # 统一事务隔离级别为 READ COMMITTED。
      #
      # 本系统的并发安全全部由「条件更新(CAS) / 行锁 / 业务唯一键」显式保证，不依赖
      # REPEATABLE READ 的可重复读语义；而 MariaDB 在 REPEATABLE READ 下会对
      # “本事务已建立一致性读快照、随后又被并发事务修改过的行”拒绝加锁读与更新
      # （报 Record has changed since last read in table 'xxx'），MySQL 则静默改读最新版本。
      # 该差异由实验一、实验二在并发扣减/并发支付回调下暴露；显式统一隔离级别后，
      # 两种数据库上的行为一致且可预期，也消除了“读快照、写最新”的语义撕裂。
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.milk.order.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: student-milk-order-secret-key-2026-please-change-in-production
  expiration: 86400000  # 24小时，单位毫秒
  header: Authorization
  prefix: "Bearer "

# 微信小程序配置（登录用 code2session）
wechat:
  appid: ""            # 小程序 AppID（本地联调可留空）
  secret: ""           # 小程序 AppSecret（禁止提交真实值）
  mock-enabled: true   # 未配置真实 appid/secret 时按 code 生成模拟 openid，便于本地联调；上线前关闭并配置真实值

# 微信支付模拟配置（仅本地模拟支付链路，非真实商户配置；上线前整体移除）
wxpay:
  mock:
    api-key: mock-wxpay-api-key                                          # 模拟商户密钥，用于回调报文签名/验签（非真实凭据）
    notify-url: http://127.0.0.1:8090/api/pay/wechat/notify              # 模拟微信回调商户后端的通知地址
    notify-delay-ms: 500                                                 # 模拟异步回调延迟（毫秒）

# 日志
logging:
  level:
    com.milk.order: debug
    org.springframework.security: info
