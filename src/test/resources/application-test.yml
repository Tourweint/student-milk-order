# ============================================================
# 实验/测试专用配置
# - 指向独立实验库 student_milk_order_test（结构与开发库一致，实验不污染开发数据）
# - 关闭全部定时任务：实验需要确定性的状态，不能被兜底任务并发改写
# - 关闭 SQL 明细日志：并发实验会打印上万行，噪声过大
# ============================================================

app:
  scheduler:
    enabled: false

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_milk_order_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    hikari:
      # 并发实验需要足够的真实并发度（默认 10 会让大部分请求排队，掩盖竞态）
      maximum-pool-size: 64
      minimum-idle: 8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: warn
    com.milk.order: warn
    org.springframework: warn
